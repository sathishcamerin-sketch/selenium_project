
name: Selenium TestNG Automation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium-tests:
    name: Run Selenium Tests on Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Download source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java 21 and cache Maven dependencies
      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Verify Java and Maven
      - name: Check Java and Maven Versions
        run: |
          java -version
          mvn -version

      # 4. Install Chrome browser
      - name: Set Up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # 5. Verify Chrome installation
      - name: Check Chrome Version
        run: google-chrome --version

      # 6. Run Maven and TestNG tests
      - name: Run Selenium TestNG Tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      # 7. Upload test reports even when tests fail
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

      # 8. Upload screenshots if your tests save them here
      - name: Upload Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-failure-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
